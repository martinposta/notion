<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Widget</title>
  <style>
    /* Reset vnějších okrajů a zamezení scrollbarů */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Odstraní případné posuvníky */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Hlavní kontejner – zabírá 100 % Notion bloku */
    .weather-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4%; /* Vnitřní bezpečný prostor */
      background: transparent; /* Přizpůsobí se pozadí v Notion */
    }

    /* Responzivní přizpůsobení velikosti textu podle výšky/šířky okna */
    .temp {
      font-size: clamp(1.5rem, 8vh, 4rem);
      font-weight: bold;
      line-height: 1.1;
    }

    .city {
      font-size: clamp(0.9rem, 3vh, 1.5rem);
      opacity: 0.8;
      margin-top: 0.2em;
    }

    .details {
      font-size: clamp(0.75rem, 2.5vh, 1.1rem);
      opacity: 0.6;
      margin-top: 0.4em;
    }
  </style>
</head>
<body>

  <div class="weather-container">
    <!-- Zde vložte váš stávající HTML/JS kód pro počasí -->
    <div class="temp" id="temp">21°C</div>
    <div class="city" id="city">Praha</div>
    <div class="details" id="details">Polojasno</div>
  </div>

</body>
</html>
