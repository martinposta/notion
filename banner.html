<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Dynamic Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      background: transparent !important;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Cinzel', serif;
    }
    :root {
      --border-gold: #c9a263;
      --text-gold: #ebdcb9;
      --gold-glow: rgba(201, 162, 99, 0.3);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --border-gold: #8c6f3e;
        --text-gold: #3d3228;
        --gold-glow: rgba(140, 111, 62, 0.2);
      }
    }
    .widget-container {
      width: 100%;
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 30px 20px;
      box-shadow: none !important;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--text-gold);
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--text-gold), #fff, var(--text-gold));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }
    .sub {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--border-gold);
      margin-top: 6px;
      text-transform: uppercase;
    }
    .botanical {
      position: absolute;
      width: 40px;
      height: 40px;
      opacity: 0.4;
      animation: float 4s ease-in-out infinite alternate;
    }
    .botanical.left { left: 15px; top: 50%; transform: translateY(-50%); }
    .botanical.right { right: 15px; top: 50%; transform: translateY(-50%) scaleX(-1); }
    @keyframes float {
      from { transform: translateY(-50%) rotate(0deg); }
      to { transform: translateY(-55%) rotate(4deg); }
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <svg class="botanical left" viewBox="0 0 100 100" fill="var(--border-gold)">
      <path d="M50 0 C60 30 90 40 100 50 C70 60 60 90 50 100 C40 70 10 60 0 50 C30 40 40 10 50 0 Z"/>
    </svg>
    <div class="title">ACADEMIA</div>
    <div class="sub">Scientia potentia est</div>
    <svg class="botanical right" viewBox="0 0 100 100" fill="var(--border-gold)">
      <path d="M50 0 C60 30 90 40 100 50 C70 60 60 90 50 100 C40 70 10 60 0 50 C30 40 40 10 50 0 Z"/>
    </svg>
  </div>
</body>
</html>
