<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Celestial Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: transparent !important; width: 100%; display: flex; justify-content: center; }
    :root { --border-gold: #c9a263; }
    @media (prefers-color-scheme: light) { :root { --border-gold: #8c6f3e; } }
    .widget-container {
      width: 100%;
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    svg {
      width: 140px;
      height: 140px;
      animation: spin 120s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="widget-container">
    <svg viewBox="0 0 100 100" fill="none" stroke="var(--border-gold)" stroke-width="0.5">
      <circle cx="50" cy="50" r="48" stroke-width="0.8"/>
      <circle cx="50" cy="50" r="36" stroke-dasharray="1,1"/>
      <circle cx="50" cy="50" r="24"/>
      <!-- Constellations -->
      <path d="M20 30 L30 25 L45 35 L55 20 L70 30" opacity="0.8"/>
      <path d="M15 65 L30 70 L40 85 L65 75 L80 80" opacity="0.8"/>
      <path d="M50 10 L50 90 M10 50 L90 50" opacity="0.2"/>
      <circle cx="30" cy="25" r="1" fill="var(--border-gold)"/>
      <circle cx="45" cy="35" r="1.5" fill="var(--border-gold)"/>
      <circle cx="55" cy="20" r="1" fill="var(--border-gold)"/>
      <circle cx="40" cy="85" r="1.2" fill="var(--border-gold)"/>
      <circle cx="65" cy="75" r="1" fill="var(--border-gold)"/>
    </svg>
  </div>
</body>
</html>
