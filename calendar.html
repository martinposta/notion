<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Widget</title>
  <style>
    /* Reset okrajů */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Kontejner kalendáře roztažený na 100 % výšky i šířky */
    .calendar-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2%;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 15%; /* Zabere 15 % výšky */
      font-size: clamp(1rem, 3vh, 1.8rem);
      font-weight: bold;
    }

    /* Mřížka kalendáře rozprostřená na zbývajících 85 % výšky */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: auto repeat(5, 1fr);
      height: 85%;
      gap: 2px;
    }

    .day-name, .day-number {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.7rem, 2vh, 1.2rem);
    }

    .day-name {
      font-weight: 600;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="calendar-container">
    <!-- Zde vložte váš stávající HTML/JS kód kalendáře -->
    <div class="calendar-header">
      <span id="month-year">Září 2026</span>
    </div>
    <div class="calendar-grid" id="calendar-grid">
      <!-- Dny kalendáře -->
    </div>
  </div>

</body>
</html>
