<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      background: transparent !important;
      background-color: transparent !important;
    }

    :root {
      --bg-color: transparent;
      --card-bg: #263d30;
      --border-color: #1a2c22;
      --border-accent: rgba(164, 187, 169, 0.4);
      --text-main: #ebdcb9;
      --text-muted: #a4bba9;
      --btn-bg: #3a5c48;
      --btn-hover: #4e7a5f;
      --shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      --font-heading: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --card-bg: #f6f2e9;
        --border-color: #e3dacb;
        --border-accent: rgba(120, 140, 125, 0.4);
        --text-main: #2d3830;
        --text-muted: #6e7a71;
        --btn-bg: #e2ebd8;
        --btn-hover: #d0ded3;
        --shadow: 0 6px 15px rgba(60, 50, 40, 0.06);
      }
    }

    body {
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }

    .widget-container {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
      position: relative;
      text-align: center;
    }

    .widget-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 1px solid var(--border-accent);
      border-radius: 12px;
      pointer-events: none;
    }

    .mode-tags {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .settings {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-heading);
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .setting-item select {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px 4px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }

    .timer-display {
      font-family: var(--font-heading);
      font-size: 4rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 4px 0 16px 0;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    button {
      background-color: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      font-family: var(--font-heading);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: var(--btn-hover);
      border-color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="mode-tags" id="mode">Práce</div>

    <div class="settings">
      <div class="setting-item">
        <label for="workSelect">Práce:</label>
        <select id="workSelect" onchange="changeSettings()">
          <option value="15">15m</option>
          <option value="20">20m</option>
          <option value="25" selected>25m</option>
          <option value="30">30m</option>
        </select>
      </div>
      <div class="setting-item">
        <label for="breakSelect">Pauza:</label>
        <select id="breakSelect" onchange="changeSettings()">
          <option value="5" selected>5m</option>
          <option value="10">10m</option>
          <option value="15">15m</option>
          <option value="20">20m</option>
        </select>
      </div>
    </div>

    <div class="timer-display" id="time">25:00</div>

    <div class="controls">
      <button onclick="startTimer()" id="startBtn">Start</button>
      <button onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <script>
    let currentMode = 'work';
    let isRunning = false;
    let isFinished = false;
    let timerId = null;

    const workSelect = document.getElementById('workSelect');
    const breakSelect = document.getElementById('breakSelect');
    const timeDisplay = document.getElementById('time');
    const startBtn = document.getElementById('startBtn');
    const modeDisplay = document.getElementById('mode');

    let timeLeft = getWorkTime();
    const alarmSound = new Audio('https://actions.google.com/sounds/v1/alarms/ding.ogg');

    function getWorkTime() { return parseInt(workSelect.value) * 60; }
    function getBreakTime() { return parseInt(breakSelect.value) * 60; }

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      if (isRunning) {
        clearInterval(timerId);
        isRunning = false;
        startBtn.textContent = 'Pokračovat';
      } else {
        if (isFinished) {
          isFinished = false;
          if (currentMode === 'work') {
            currentMode = 'break';
            modeDisplay.textContent = 'Pauza';
            timeLeft = getBreakTime();
          } else {
            currentMode = 'work';
            modeDisplay.textContent = 'Práce';
            timeLeft = getWorkTime();
          }
          updateDisplay();
        }

        isRunning = true;
        startBtn.textContent = 'Pauza';

        timerId = setInterval(() => {
          timeLeft--;
          updateDisplay();

          if (timeLeft <= 0) {
            clearInterval(timerId);
            isRunning = false;
            isFinished = true;
            alarmSound.play().catch(e => console.log(e));
            startBtn.textContent = currentMode === 'work' ? 'Spustit pauzu' : 'Spustit práci';
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerId);
      isRunning = false;
      isFinished = false;
      currentMode = 'work';
      modeDisplay.textContent = 'Práce';
      timeLeft = getWorkTime();
      startBtn.textContent = 'Start';
      updateDisplay();
    }

    function changeSettings() {
      if (!isRunning && !isFinished) {
        timeLeft = currentMode === 'work' ? getWorkTime() : getBreakTime();
        updateDisplay();
      }
    }

    updateDisplay();
  </script>
</body>
</html>
