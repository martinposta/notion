<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Hourglass Pomodoro</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { background: transparent !important; width: 100%; display: flex; justify-content: center; font-family: 'Cinzel', serif; }
    :root { --border-gold: #c9a263; --text-main: #ebdcb9; --btn-bg: rgba(201, 162, 99, 0.15); }
    @media (prefers-color-scheme: light) { :root { --border-gold: #8c6f3e; --text-main: #2d241e; --btn-bg: rgba(140, 111, 62, 0.15); } }
    .widget-container {
      width: 100%;
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
    }
    .timer-display { font-size: 1.4rem; letter-spacing: 2px; }
    .controls { display: flex; gap: 8px; }
    button {
      background: var(--btn-bg);
      border: 1px solid var(--border-gold);
      color: var(--text-main);
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <div style="font-size: 1.2rem;">⏳</div>
    <div class="timer-display" id="display">25:00</div>
    <div class="controls">
      <button onclick="toggleTimer()" id="btnStart">Start</button>
      <button onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <script>
    let timeLeft = 25 * 60;
    let timerId = null;

    function updateDisplay() {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const s = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('display').textContent = `${m}:${s}`;
    }

    function toggleTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        document.getElementById('btnStart').textContent = 'Start';
      } else {
        document.getElementById('btnStart').textContent = 'Pauza';
        timerId = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
          } else {
            clearInterval(timerId);
            timerId = null;
            alert("Tempus Fugit – Čas vypršel.");
          }
        }, 1000);
      }
    }

    function resetTimer() {
      if (timerId) clearInterval(timerId);
      timerId = null;
      timeLeft = 25 * 60;
      document.getElementById('btnStart').textContent = 'Start';
      updateDisplay();
    }
  </script>
</body>
</html>
