<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Latin Quotes</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      background: transparent !important;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Cormorant Garamond', serif;
    }
    :root {
      --border-gold: #c9a263;
      --text-main: #ebdcb9;
      --text-sub: #a89682;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --border-gold: #8c6f3e;
        --text-main: #2d241e;
        --text-sub: #6e5f52;
      }
    }
    .widget-container {
      width: 100%;
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 24px;
      box-shadow: none !important;
      text-align: center;
      cursor: pointer;
    }
    .quote-box {
      opacity: 1;
      transition: opacity 0.5s ease, transform 0.5s ease;
      transform: translateY(0);
    }
    .quote-box.fade {
      opacity: 0;
      transform: translateY(-6px);
    }
    .latin {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: var(--text-main);
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .translation {
      font-size: 0.95rem;
      font-style: italic;
      color: var(--text-sub);
    }
    .hint {
      margin-top: 14px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--border-gold);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="widget-container" onclick="nextQuote()">
    <div class="quote-box" id="quoteBox">
      <div class="latin" id="latin">Per aspera ad astra</div>
      <div class="translation" id="translation">Přes překážky ke hvězdám</div>
    </div>
    <div class="hint">Klikněte pro další myšlenku</div>
  </div>

  <script>
    const quotes = [
      { l: "Per aspera ad astra", t: "Přes překážky ke hvězdám." },
      { l: "Amor fati", t: "Miluj svůj osud." },
      { l: "Tempus fugit, memoria manet", t: "Čas plyne, vzpomínky zůstávají." },
      { l: "Vita brevis, ars longa", t: "Život je krátký, umění dlouhé." },
      { l: "Carpe diem, quam minimum credula postero", t: "Užij dne a minimálně věř budoucnosti." },
      { l: "Audentes fortuna iuvat", t: "Odvážným štěstí přeje." },
      { l: "Cogito, ergo sum", t: "Myslím, tedy jsem." },
      { l: "Non scholae, sed vitae discimus", t: "Učíme se ne pro školu, ale pro život." }
    ];

    function nextQuote() {
      const box = document.getElementById('quoteBox');
      box.classList.add('fade');
      setTimeout(() => {
        const random = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('latin').textContent = random.l;
        document.getElementById('translation').textContent = random.t;
        box.classList.remove('fade');
      }, 500);
    }
  </script>
</body>
</html>
