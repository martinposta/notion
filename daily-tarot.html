<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Daily Tarot</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { background: transparent !important; width: 100%; display: flex; justify-content: center; font-family: 'Cinzel', serif; }
    :root { --border-gold: #c9a263; --text-main: #ebdcb9; --btn-bg: rgba(201, 162, 99, 0.15); }
    @media (prefers-color-scheme: light) { :root { --border-gold: #8c6f3e; --text-main: #2d241e; --btn-bg: rgba(140, 111, 62, 0.15); } }
    .widget-container {
      width: 100%;
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-main);
    }
    .tarot-card {
      width: 110px;
      height: 160px;
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      background: var(--btn-bg);
      transition: transform 0.3s;
    }
    .tarot-card:hover { transform: translateY(-2px); }
    .card-title { font-size: 0.85rem; font-weight: 700; margin-top: 6px; }
    .card-key { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.95rem; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="tarot-card" onclick="drawCard()">
      <div style="font-size: 1.8rem;" id="icon">🔮</div>
      <div class="card-title" id="name">Klepnutím vytáhnout</div>
      <div class="card-key" id="key">Arcanum</div>
    </div>
  </div>

  <script>
    const cards = [
      { icon: "💡", name: "IX. Eremita", key: "Moudrost & Ticho" },
      { icon: "🌟", name: "XVII. Stella", key: "Naděje & Inspirace" },
      { icon: "⚖️", name: "XI. Iustitia", key: "Rovnováha & Pravda" },
      { icon: "🏛️", name: "V. Hierophanta", key: "Vědění & Tradice" },
      { icon: "🌙", name: "XVIII. Luna", key: "Intuice & Sny" }
    ];

    function drawCard() {
      const c = cards[Math.floor(Math.random() * cards.length)];
      document.getElementById('icon').textContent = c.icon;
      document.getElementById('name').textContent = c.name;
      document.getElementById('key').textContent = c.key;
    }
  </script>
</body>
</html>
